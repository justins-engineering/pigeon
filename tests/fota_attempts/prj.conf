CONFIG_ZTEST=y

# Real settings-on-NVS persistence (native_sim's own storage_partition), so
# the budget is exercised against the same subsystem that holds it on
# hardware -- a mock would not catch a record that cannot survive a reboot,
# which is the whole point of persisting it.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_ZTEST=y

CONFIG_PIGEON=y
CONFIG_PIGEON_CONNECTOR_COAP=y
CONFIG_PIGEON_COAP_TRANSPORT_UDP=y
CONFIG_PIGEON_COAP_DTLS_CID=n
CONFIG_PIGEON_COAP_SEC_TAG=45
# Nothing answers here: this suite fetches firmware and never polls the shadow.
CONFIG_PIGEON_ENDPOINT="coaps://127.0.0.1:56842/device/pigeons/test"

# The firmware half of a CoAP build: an HTTPS host of its own, and the bearer token the
# platform keeps for this pigeon. Port 443 is implied, which only the in-process stack can
# serve without privileges. A made-up token: the server in src/main.c checks it.
CONFIG_PIGEON_FOTA=y
CONFIG_PIGEON_FOTA_HTTPS_ENDPOINT="https://127.0.0.1/device/pigeons/test"
CONFIG_PIGEON_TOKEN="coap-fota-test-token"
CONFIG_PIGEON_HTTPS_SEC_TAG=42
CONFIG_PIGEON_FOTA_CURRENT_VERSION="1.0.0"
CONFIG_PIGEON_FOTA_RESUME=y
CONFIG_PIGEON_FOTA_ATTEMPT_BUDGET=y
CONFIG_PIGEON_FOTA_MAX_ATTEMPTS_PER_VERSION=2
# A refused chunk ends the call at once, so a test interrupts a transfer without waiting out
# the backoff.
CONFIG_PIGEON_FOTA_CHUNK_RETRIES=0

CONFIG_BOOTLOADER_MCUBOOT=y
# The nRF91 samples' mode: the image starts at the slot's first byte, where the test reads it.
CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_USING_MOVE=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Zephyr's own stack over loopback, not the host's sockets: the firmware host is port 443.
CONFIG_NETWORKING=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
# Each chunk is a connection at both ends, and closed ones linger in TIME_WAIT.
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=16
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_TCP_TIME_WAIT_DELAY=10
CONFIG_ZVFS_OPEN_ADD_SIZE_NET=10
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_TLS_CREDENTIALS=y
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=8
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_ENABLE_DTLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=8
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=y
# The fetch names its host for certificate checks, an option sockets refuse without X.509.
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_TLS12_PSK_TO_MS=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_DERIVE=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_ALG_TLS12_PRF=y

# getaddrinfo() allocates its answer.
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=16384
